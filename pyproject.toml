[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdrtmo"
version = "0.1.0"
description = "Python port of the HDR Toolbox tone-mapping workflow"
readme = "PYTHON_README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "pyexr>=0.5",
    "rawpy>=0.19",
    "scipy>=1.10",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
hdrtmo = "hdrtmo.cli:main"

[tool.setuptools.packages.find]
include = ["hdrtmo*"]
